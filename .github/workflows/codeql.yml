name: codeql

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Todos los lunes a las 06:00 UTC, además de en cada push/PR — para pillar CVEs nuevas
    # en el propio motor de CodeQL aunque no haya cambios de código esa semana.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeQL necesita este permiso para publicar los hallazgos en la pestaña Security.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp

      # Build manual (no autobuild): el autobuild de CodeQL a veces falla en soluciones
      # multi-proyecto con Directory.Build.props; con "dotnet build" directo no hay ambigüedad.
      - name: Build
        run: dotnet build OfiFlow.slnx

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:csharp"
