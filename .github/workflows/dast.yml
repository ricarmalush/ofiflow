name: dast

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Contenedor efímero: solo existe durante este job, sin datos reales, sin acceso desde
      # fuera del runner — la contraseña fija aquí no protege nada (ADR-010).
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiOnly!DastPassw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnly!DastPassw0rd -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Añadir herramientas globales de dotnet al PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # Efímero, generado en cada ejecución — nunca un valor fijo en el repositorio (ADR-010).
      - name: Generar Jwt__Secret efímero
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Aplicar migraciones
        working-directory: src/OfiFlow.Infrastructure
        run: dotnet ef database update
        env:
          ConnectionStrings__Default: "Server=localhost,1433;Database=OfiFlow;User Id=sa;Password=CiOnly!DastPassw0rd;TrustServerCertificate=True;"

      - name: Arrancar la API en segundo plano
        working-directory: src/OfiFlow.Api
        run: nohup dotnet run --no-launch-profile > "$GITHUB_WORKSPACE/api.log" 2>&1 &
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5279
          ConnectionStrings__Default: "Server=localhost,1433;Database=OfiFlow;User Id=sa;Password=CiOnly!DastPassw0rd;TrustServerCertificate=True;"
          Jwt__Secret: ${{ env.JWT_SECRET }}
          Jwt__Issuer: "OfiFlow.Api.Dast"
          Jwt__Audience: "OfiFlow.Client.Dast"

      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5279/openapi/v1.json > /dev/null; then
              echo "API lista tras $i intento(s)."
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondió a tiempo." >&2
          cat "$GITHUB_WORKSPACE/api.log" || true
          exit 1

      # Sin autenticar: ve los endpoints anónimos de /auth y comprueba que el resto exige
      # token (401). El escaneo autenticado queda como NEXT (ADR-010).
      #
      # continue-on-error: modo informe (ADR-010) hasta ajustar .zap/rules.tsv con el primer
      # informe real — quitar cuando esa tarea de tasks.md quede cerrada, para que a partir
      # de ese momento los hallazgos FAIL sí bloqueen el PR.
      - name: ZAP API Scan
        continue-on-error: true
        uses: zaproxy/action-api-scan@a9a916402665623ce9d37a6998d7b48e6b35dd6c # v0.9.0
        with:
          target: "http://localhost:5279/openapi/v1.json"
          format: openapi
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"

      - name: Subir informe de ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
